[project]
name = "resume-scrubber"
version = "1.0.0"
description = "Strips personally identifying data from candidate CVs (PDF, DOCX, scanned PDF)."
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    # OCR path for scanned, image-only PDFs. Drop these two if you never need it:
    # nothing else imports them, and they are most of the venv's ~440 MB.
    "rapidocr-onnxruntime>=1.4.4",
    "pillow>=11.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]
# The web frontend. Not needed by the command line, so it is a separate group:
# `uv sync --project resume_scrubber --group frontend`.
frontend = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "streamlit>=1.40.0",
    "httpx>=0.28.0",
]

[tool.uv]
# Run from the repository root as `python -m resume_scrubber.<tool>`; there is
# nothing to build or install.
package = false

[tool.ruff]
line-length = 95
target-version = "py312"
# The frontend lives beside the package and shares its configuration.
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "BLE", "SLF"]
ignore = [
    "ANN401",  # a few PyMuPDF and python-docx objects have no useful type
    "E501",    # long lines are the regexes and the city list; both stay readable
    "RUF001",  # the corpus is full of typographic dashes and quotes on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"names.py" = ["E501"]           # one CV per line, however long the filename
"tests/*" = ["ANN001", "ANN201", "ANN003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-q"
