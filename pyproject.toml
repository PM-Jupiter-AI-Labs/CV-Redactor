# Repository-level configuration for the tools that run across both packages
# (`resume_scrubber` and `frontend`). The redactor's own dependencies and
# metadata live in resume_scrubber/pyproject.toml.

[tool.pytest.ini_options]
testpaths = ["resume_scrubber/tests", "frontend/tests"]
addopts = "-q"
filterwarnings = [
    # Starlette's TestClient warns about httpx; not ours to fix.
    "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 95
target-version = "py312"
extend-exclude = [".venv", "resume_scrubber/.venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "BLE", "SLF"]
ignore = ["ANN401", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"resume_scrubber/names.py" = ["E501"]
"**/tests/*" = ["ANN001", "ANN201", "ANN003", "SLF"]
# File()/Form() in an argument default is how FastAPI declares a parameter.
"frontend/api/main.py" = ["B008"]
