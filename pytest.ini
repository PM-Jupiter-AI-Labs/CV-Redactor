; Test configuration for the whole repository.
;
; Not in a root pyproject.toml on purpose: see the note in ruff.toml.
[pytest]
testpaths = resume_scrubber/tests frontend/tests
addopts = -q
filterwarnings =
    ; Starlette's TestClient warns about httpx; not ours to fix.
    ignore::DeprecationWarning:starlette.*
